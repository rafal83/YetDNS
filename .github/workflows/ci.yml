name: YetDNS
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/update_app_catalog.py --offline
      - run: git diff --exit-code -- main/app_catalog.inc
      - run: python3 tools/build_blocklist.py --output main/blocklist.bin data/blocked.txt
      - run: cmake -S tests -B build-host -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-host
      - run: ctest --test-dir build-host --output-on-failure
      - run: python3 tools/check_dashboard.py build-host/dashboard.js
      - run: node --check build-host/dashboard.js
      - run: node --check main/diagnostic.js
      - run: node tests/diagnostic_tests.js
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [udp, doh]
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Select DoH
        if: matrix.mode == 'doh'
        run: echo 'CONFIG_YETDNS_DOH=y' >> sdkconfig.defaults
      - name: Build ESP32-S3
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
